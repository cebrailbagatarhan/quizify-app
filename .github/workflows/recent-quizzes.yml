name: Recent quiz history regression

on:
  pull_request:
    paths:
      - 'screens/ProfileScreen.js'
      - 'utils/recentQuizzes.js'
      - 'tests/recentQuizzes.test.cjs'
      - 'tests/recentAverage.test.mjs'
      - '.github/workflows/recent-quizzes.yml'
  push:
    branches: [main]
    paths:
      - 'screens/ProfileScreen.js'
      - 'utils/recentQuizzes.js'
      - 'tests/recentQuizzes.test.cjs'
      - 'tests/recentAverage.test.mjs'
      - '.github/workflows/recent-quizzes.yml'

permissions:
  contents: read

jobs:
  recent-quizzes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/recentQuizzes.test.cjs tests/recentAverage.test.mjs
